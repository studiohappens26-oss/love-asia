<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Love Asia — Menu</title>
  <meta name="description" content="Love Asia — Pan-Asian kitchen. Browse our veg and non-veg menu." />
  <meta name="theme-color" content="#0d2a33" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230d2a33'/%3E%3Cpath d='M32 50 C 14 38 10 28 16 21 c 5-6 12-4 16 2 c 4-6 11-8 16-2 c 6 7 2 17-16 29z' fill='%23e8481c'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="is-landing">

  <!-- Reusable koi drawing for the landing tile -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <clipPath id="koi-body-clip">
        <path d="M18 25 C 30 15, 60 10, 95 14 C 112 16, 118 22, 118 25 C 118 28, 112 34, 95 36 C 60 40, 30 35, 18 25Z" />
      </clipPath>
      <symbol id="koi" viewBox="0 0 120 50">
        <path d="M22 25 C 10 14, 3 8, 0 5 C 7 18, 7 32, 0 45 C 3 42, 10 36, 22 25Z" fill="rgba(255,240,228,.8)" />
        <path d="M88 15 C 84 6, 76 2, 70 2 C 74 8, 78 12, 84 16Z" fill="rgba(255,240,228,.75)" />
        <path d="M88 35 C 84 44, 76 48, 70 48 C 74 42, 78 38, 84 34Z" fill="rgba(255,240,228,.75)" />
        <path d="M18 25 C 30 15, 60 10, 95 14 C 112 16, 118 22, 118 25 C 118 28, 112 34, 95 36 C 60 40, 30 35, 18 25Z" fill="#f7f3ea" />
        <g clip-path="url(#koi-body-clip)">
          <ellipse cx="92" cy="21" rx="13" ry="9" fill="#e8481c" />
          <ellipse cx="60" cy="28" rx="15" ry="9" fill="#e8481c" />
          <ellipse cx="34" cy="22" rx="8" ry="6" fill="#e8481c" />
        </g>
        <circle cx="108" cy="19" r="1.6" fill="#161616" />
        <circle cx="108" cy="31" r="1.6" fill="#161616" />
      </symbol>
    </defs>
  </svg>

  <!-- Animated backgrounds -->
  <div class="scene" aria-hidden="true">
    <div class="scene-pond">
      <canvas id="pond"></canvas>
      <div class="sunrays"><span></span><span></span><span></span></div>
    </div>
    <div class="scene-grove" id="grove"></div>
  </div>

  <!-- ============ LANDING ============ -->
  <section class="landing" id="landing" aria-labelledby="brand-title">
    <div class="landing__inner">
      <header class="brand">
        <div class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 64 64"><path d="M32 54 C 12 40 7 28 14 20 c 6-7 14-5 18 2 c 4-7 12-9 18-2 c 7 8 2 20-18 34z" fill="currentColor"/></svg>
        </div>
        <h1 class="brand__name" id="brand-title">Love Asia</h1>
        <p class="brand__tag" id="brand-tag">Pan-Asian Kitchen</p>
      </header>

      <p class="landing__prompt">How would you like to dine today?</p>

      <div class="choices">
        <button class="choice choice--nonveg" data-mode="nonveg" type="button">
          <span class="choice__art" aria-hidden="true">
            <span class="mini-ripple"></span><span class="mini-ripple"></span>
            <span class="koi-orbit">
              <span class="koi-pos koi-pos--a"><svg class="koi-svg" viewBox="0 0 120 50"><use href="#koi"/></svg></span>
              <span class="koi-pos koi-pos--b"><svg class="koi-svg koi-svg--gold" viewBox="0 0 120 50"><use href="#koi"/></svg></span>
            </span>
          </span>
          <span class="choice__label">
            <span class="mark mark--nonveg" aria-hidden="true"></span>
            <span>
              <strong>Non-Veg</strong>
              <small>The full menu</small>
            </span>
          </span>
        </button>

        <button class="choice choice--veg" data-mode="veg" type="button">
          <span class="choice__art" aria-hidden="true">
            <svg class="mini-bamboo" viewBox="0 0 160 160">
              <g class="mb mb--1"><rect x="40" y="10" width="10" height="160" rx="3"/><rect x="38" y="50" width="14" height="4" rx="2"/><rect x="38" y="100" width="14" height="4" rx="2"/><path d="M45 52 C 30 46, 16 46, 6 52 C 18 56, 32 56, 45 52Z"/><path d="M45 100 C 32 90, 22 86, 12 88 C 22 96, 32 100, 45 100Z"/></g>
              <g class="mb mb--2"><rect x="80" y="0" width="12" height="170" rx="3"/><rect x="78" y="38" width="16" height="4" rx="2"/><rect x="78" y="92" width="16" height="4" rx="2"/><path d="M92 40 C 108 30, 124 30, 136 36 C 122 42, 106 44, 92 40Z"/><path d="M86 2 C 76 -6, 66 -8, 56 -4 C 66 2, 76 4, 86 2Z"/></g>
              <g class="mb mb--3"><rect x="118" y="24" width="9" height="150" rx="3"/><rect x="116" y="70" width="13" height="4" rx="2"/><rect x="116" y="120" width="13" height="4" rx="2"/><path d="M122 72 C 136 64, 148 64, 158 70 C 148 74, 136 76, 122 72Z"/></g>
            </svg>
          </span>
          <span class="choice__label">
            <span class="mark mark--veg" aria-hidden="true"></span>
            <span>
              <strong>Veg</strong>
              <small>Pure vegetarian</small>
            </span>
          </span>
        </button>
      </div>
    </div>
  </section>

  <!-- ============ MENU ============ -->
  <div class="menu-view" id="menu-view" hidden>
    <header class="topbar">
      <button class="icon-btn" id="back-btn" type="button" aria-label="Back to start">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="topbar__brand">Love Asia</div>
      <div class="mode-switch" role="radiogroup" aria-label="Menu type">
        <button type="button" role="radio" data-mode="veg" aria-checked="false"><span class="mark mark--veg" aria-hidden="true"></span>Veg</button>
        <button type="button" role="radio" data-mode="nonveg" aria-checked="false"><span class="mark mark--nonveg" aria-hidden="true"></span>Non-Veg</button>
      </div>
      <button class="icon-btn" id="search-btn" type="button" aria-label="Search the menu" aria-expanded="false" aria-controls="search-bar">
        <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5L20 20" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </header>

    <div class="search-bar" id="search-bar" hidden>
      <input id="search" type="search" placeholder="Search dishes…" autocomplete="off" enterkeyhint="search" aria-label="Search dishes" />
    </div>

    <nav class="cats" id="cats" aria-label="Menu sections"></nav>

    <div class="menu-hero">
      <p class="menu-hero__kicker" id="hero-kicker"></p>
      <h1 class="menu-hero__title">Love Asia</h1>
      <p class="menu-hero__sub" id="hero-sub"></p>
    </div>

    <main class="menu" id="menu" tabindex="-1"></main>

    <footer class="menu-footer">
      <button class="pages-btn" id="pages-btn" type="button" hidden>View printed menu</button>
      <p class="legend">
        <span><span class="mark mark--veg" aria-hidden="true"></span> Vegetarian</span>
        <span><span class="mark mark--nonveg" aria-hidden="true"></span> Non-vegetarian</span>
      </p>
      <p class="fine">Prices are exclusive of applicable taxes. Please inform your server of any allergies.</p>
      <p class="fine" id="mode-hint"></p>
    </footer>
  </div>

  <!-- Printed menu viewer -->
  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Printed menu">
    <button class="icon-btn lightbox__close" id="lightbox-close" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    <div class="lightbox__track" id="lightbox-track"></div>
  </div>

  <script src="assets/js/menu-data.js"></script>
  <script src="assets/js/koi-pond.js"></script>
  <script src="assets/js/bamboo.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
